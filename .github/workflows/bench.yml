# Run every adapter over every case, and publish the scoreboard to GitHub Pages: on every push to
# main, nightly, and by hand.  Pages must be set to deploy from GitHub Actions (Settings ▸ Pages).
name: bench

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the adapters
        run: python harness/build.py
      - name: Write the cases
        run: python cases/generate.py && git diff --exit-code cases/
      - name: Run the suite
        run: python harness/run.py --timeout 120
      - name: Draw the cases
        run: python harness/draw.py
      - name: Render the scoreboard and the case pages
        run: python harness/site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: bench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
