# Run the kernels over the cases, and publish the scoreboard to GitHub Pages: on every push to main,
# nightly, and by hand.  Pages must be set to deploy from GitHub Actions (Settings ▸ Pages).
#
# Three jobs. `plan` decides what to run (harness/changed.py): on a push, the cases it touched, with
# the kernels whose implementations of them it touched. `bench` runs that on top of the last run's
# results, which the Actions cache keeps under a key naming the commit they were made at; with
# nothing to run it is skipped, building nothing. `site` renders the newest results there are and
# deploys them, every time, even when the bench fails. The nightly run, and a run by hand unless
# told otherwise, runs the whole suite.
name: bench

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run the whole suite, not only what changed since the last run
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
  # the last results: each kernel's, their triangles, and the drawings
  STATE: |
    results
    site/drawings
  # the key they are kept under: bench-results-<commit>-<run>-<attempt>
  KEY: bench-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.plan.outputs.work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # to diff against the commit the last results were made at
          filter: blob:none
      # only the key, which names their commit: nothing is downloaded
      - name: Find the last results
        id: last
        if: env.FULL != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE }}
          key: ${{ env.KEY }}
          restore-keys: bench-results-
          lookup-only: true
      - name: Plan what to run
        id: plan
        env:
          LAST: ${{ steps.last.outputs.cache-matched-key }}
        run: |
          if [ "$FULL" = true ]; then
            python3 harness/changed.py --full
          else
            base=${LAST#bench-results-}
            python3 harness/changed.py --base "${base%%-*}"
          fi

  bench:
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # for Aetheris, a .NET kernel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore the last results
        id: last
        if: env.FULL != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE }}
          key: ${{ env.KEY }}
          restore-keys: bench-results-
      # planned again from what was restored: with nothing restored, the whole suite runs
      - name: Plan what to run
        id: plan
        env:
          LAST: ${{ steps.last.outputs.cache-matched-key }}
        run: |
          if [ "$FULL" = true ] || [ -z "$LAST" ]; then
            python harness/changed.py --full > plan.json
          else
            base=${LAST#bench-results-}
            python harness/changed.py --base "${base%%-*}" > plan.json
          fi
          cat plan.json
      - name: Build the adapters
        if: steps.plan.outputs.build != ''
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: python harness/build.py $BUILD
      - name: Run the cases
        run: python harness/run.py --plan plan.json --timeout 120
      - name: Draw the cases
        if: steps.plan.outputs.draw != ''
        env:
          DRAW: ${{ steps.plan.outputs.draw }}
        run: |
          if [ "$DRAW" = all ]; then python harness/draw.py; else python harness/draw.py $DRAW; fi
      # only when every step succeeded: else the next run starts again from the last results
      - name: Keep the results for the next run
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE }}
          key: ${{ env.KEY }}

  site:
    needs: [plan, bench]
    # whether the bench ran, was skipped or failed: the site shows the newest results there are
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the newest results
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE }}
          key: ${{ env.KEY }}
          restore-keys: bench-results-
      - name: Render the scoreboard and the case pages
        run: python3 harness/site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
