[package]
name = "brep-bench-solidcraft"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The brep-bench runner for SolidCraft's kernel, and its implementation of every case."
publish = false

# SolidCraft's B-rep kernel boundary (https://solidcraft.io), from its repository at a release tag:
# the crate is not published on its own. Since November 2026 (SolidCraft #11351) the kernel
# behind it is solidcore, SolidCraft's Rust port of NVIDIA's SMLib, kept in the same repository
# (`solidcore/`); the 2D profile types (`Seg2`, `Loop2`, `Region2`) are solidcore-record's.
[dependencies]
solidcraft-kernel = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
# solidcore's own crates, for the cases built on solidcore-ops, the modelling layer under
# solidcraft-kernel (src/ops.rs): ops itself, the kernel beneath it, its record conversions, its
# mesher and the STEP writer SolidCraft's export goes through
solidcore = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.51.2" }
serde_json = "1"

[profile.release]
debug = 0
# as SolidCraft's own release profile
opt-level = 3
lto = "thin"
codegen-units = 16
