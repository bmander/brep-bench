# The cases SolidCraft's kernel builds by working around a feature it lacks, and what that is
# (SPEC.md, "A workaround is flagged").

"primitives/cone-frustum" = "no cone primitive"
"tangent/cone-tip-on-face" = "no cone primitive"
"tangent/ice-cream-cone" = "no cone primitive"
"nurbs/bezier-dome" = "no solid from a NURBS surface"
"nurbs/bspline-dome" = "no solid from a NURBS surface, no B-spline curve in a profile"
"nurbs/drilled-dome" = "no solid from a NURBS surface"
"nurbs/sliced-dome" = "no solid from a NURBS surface"
"nurbs/vault-tangent-plane" = "no NURBS surface of even degree"
"spline/peanut-prism" = "no B-spline curve in a profile"
"spline/rational-spheroid" = "no NURBS curve in a profile"
"spline/pipe-on-planar-cubic" = "no sweep along a spline"
"spline/square-on-planar-cubic" = "no sweep along a spline"
"spline/pipe-on-twisted-cubic" = "no space curve, no sweep along a spline"
