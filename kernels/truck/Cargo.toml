[package]
name = "brep-bench-truck"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The brep-bench runner for truck: one truck program per case."
publish = false
build = "build.rs"

[dependencies]
truck-modeling = { git = "https://github.com/ricosjp/truck" }
truck-shapeops = { git = "https://github.com/ricosjp/truck" }
truck-meshalgo = { git = "https://github.com/ricosjp/truck" }
truck-geometry = { git = "https://github.com/ricosjp/truck" }
truck-geotrait = { git = "https://github.com/ricosjp/truck", features = ["derive"] }
truck-topology = { git = "https://github.com/ricosjp/truck" }
truck-polymesh = { git = "https://github.com/ricosjp/truck" }
serde_json = "1"

[profile.release]
debug = 0
