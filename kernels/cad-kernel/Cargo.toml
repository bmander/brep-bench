[package]
name = "brep-bench-cad-kernel"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The brep-bench runner for cad-kernel: one cad-kernel program per case."
publish = false

[dependencies]
# a commit of geomsolver, exactly, until the release after 0.6.3 carries its planar sweep
# (`swept::planar_solid`, #880 Q2): the scoreboard says which, and moving to another is a change
# made here
cad-kernel = { git = "https://github.com/bmander/geomsolver", rev = "8d7a261af883956298b8325342ad3ad278974ba9" }

[profile.release]
debug = 0
