[package]
name = "brep-bench-cad-kernel"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The brep-bench runner for cad-kernel: one cad-kernel program per case."
publish = false

[dependencies]
# a release, exactly: the scoreboard says which, and moving to another is a change made here.
# For now the geomsolver commit that adds `build::hull`, which no release has yet: to be pinned
# to the release that carries it before this merges.
cad-kernel = { git = "https://github.com/bmander/geomsolver", rev = "4de889e0da5b8d7fa00838f3c3c2c250c9ebfc77" }

[profile.release]
debug = 0
