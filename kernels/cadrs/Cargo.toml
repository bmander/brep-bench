[package]
name = "brep-bench-cadrs"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The brep-bench runner for cadrs's kernel, and its implementation of every case."
publish = false

# cadrs's kernel (the crate cadrs_kernel) is not on crates.io, so it comes from cadrs's
# repository at one commit: the board says which, and moving to another is a change made here.
[dependencies]
cadrs_kernel = { git = "https://github.com/rvdende/cadrs", rev = "9c8df222208ba5a8fef717986a7d2a920fc56057" }
nalgebra = "0.35"

# The runner is built once and run once per case: whole-program optimisation for its speed,
# no unwinding (a panic is a crash either way) and no symbols, for its size and start.
[profile.release]
debug = 0
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# For sampling the runner's stacks (`cargo build --profile profiling`): line tables, no LTO.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
lto = false
codegen-units = 16
