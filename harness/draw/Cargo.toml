[package]
name = "brep-bench-draw"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Draws every brep-bench case: a third-angle sheet of its expected solid, and its thumbnail."
publish = false

[[bin]]
name = "draw"
path = "src/main.rs"

# What the drawing itself needs no crate for (the triangles, the depth buffer, the lines) is in
# src/; these are for the files around it: the results and the index (JSON), the PNGs' compression
# and checksums, and the stamp each drawing is known by.
[dependencies]
flate2 = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
